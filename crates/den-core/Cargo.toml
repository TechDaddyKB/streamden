[package]
name = "den-core"
description = "StreamDen engine core: event bus, triggers, actions, queues, variables, storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Engine ≠ shell: never depend on Tauri or any webview crate here.
[dependencies]
den-protocol.workspace = true
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
im = "=15.1.0"
arc-swap = "=1.9.3"
regex = "=1.13.1"
uuid = { version = "=1.28.0", features = ["v7"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
croner = "=4.0.1"
chrono-tz = "=0.10.4"
unicode-casefold = "=0.2.0"
rand = "=0.10.3"
tracing = "=0.1.44"
# Portable mount paths and filesystem types for Spec 03 §19 (MIT OR Apache-2.0).
mountpoints = "=0.2.1"

[dev-dependencies]
proptest = "=1.12.0"
criterion = "=0.8.2"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["test-util"] }
