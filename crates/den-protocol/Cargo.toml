[package]
name = "den-protocol"
description = "StreamDen wire and storage contracts (Spec 02). Single-writer crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Provisional: Q-B6 decides between MIT OR Apache-2.0 and GPL-3.0-or-later.
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Generators are pinned exactly (Spec 02 §9.1): output must only change when sources do.
schemars = { version = "=1.2.3", features = ["uuid1"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
jsonschema = { version = "0.57.0", default-features = false }
