# Artifacts only. No release publishing, signing credentials or updater payloads.
name: Packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'apps/desktop/tauri.conf.json'
      - '.github/workflows/release-packaging.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  bundles:
    name: Bundles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: windows-2025
            bundles: msi,nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libwebkit2gtk-4.1-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            patchelf libfuse2t64
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      # Never reduce minimumReleaseAge or use --ignore-minimum-release-age.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: packaging-${{ matrix.os }}
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      - run: cargo install tauri-cli --version 2.12.3 --locked
      - name: Pin AppImage tooling
        if: runner.os == 'Linux'
        run: bash packaging/fetch-appimage-tools.sh
      - name: Build unsigned installers
        id: installers
        working-directory: apps/desktop
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
        run: cargo tauri build --bundles "$BUNDLE_TARGETS" -- --locked
      - name: Upload installers
        if: ${{ always() && steps.installers.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streamden-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  install-smoke:
    name: Install smoke (${{ matrix.distro }})
    needs: bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable-slim@sha256:eb593cf2c358cacef45ca0a424bbc7d30cfa3466265fc2662b9466a0ca6ba1c5
          - distro: fedora
            image: fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - distro: arch
            image: archlinux:latest@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Download Linux installers from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: streamden-ubuntu-24.04-${{ github.sha }}
          path: artifacts
      - name: Install artifact and verify runtime
        env:
          SMOKE_IMAGE: ${{ matrix.image }}
          SMOKE_DISTRO: ${{ matrix.distro }}
        run: |
          docker run --rm -v "$PWD:/work:ro" "$SMOKE_IMAGE" \
            bash /work/packaging/install-smoke.sh "$SMOKE_DISTRO"
