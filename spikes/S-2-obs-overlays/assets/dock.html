<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S-2 chat dock</title>
<style>
  html, body { margin: 0; height: 100%; background: #14121c; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { background: #7c3aed; color: #fff; font-weight: 700; padding: 8px 10px; }
  #state { font-weight: 400; font-size: 12px; opacity: .9; margin-left: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .msg b { color: #f472b6; }
  form { display: flex; gap: 6px; padding: 8px; background: #1f1b2e; }
  input { flex: 1; background: #0e0c14; color: #fff; border: 1px solid #3b3552; border-radius: 6px; padding: 6px; }
  button { background: #ec4899; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; }
</style>
</head>
<body>
<header>StreamDen S-2 chat dock<span id="state">connecting…</span></header>
<div id="log"></div>
<form id="f"><input id="t" placeholder="Send a test message" autocomplete="off"><button>Send</button></form>
<script>
'use strict';
function report(kind, data) {
  return fetch('/report', { method: 'POST', headers: { 'content-type': 'text/plain' }, keepalive: true,
    body: JSON.stringify({ kind, page: location.pathname, origin: location.origin, t: Date.now(), ...data }) })
    .catch(() => {});
}
const log = document.getElementById('log'), state = document.getElementById('state');
function add(user, text) {
  const d = document.createElement('div'); d.className = 'msg';
  d.innerHTML = '<b></b>: <span></span>';
  d.firstChild.textContent = user; d.lastChild.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
let attempts = 0, lastId = 0;
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws?client=dock&last=${lastId}`);
  ws.onopen = () => { attempts = 0; state.textContent = '· connected'; ws.send(JSON.stringify({ type: 'hello', client: 'dock' })); };
  ws.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.id) lastId = Math.max(lastId, ev.id);
    if (ev.type === 'chat') add(ev.user, ev.text);
    if (ev.type === 'alert') add('alert', ev.text || `#${ev.id}`);
  };
  ws.onclose = () => {
    state.textContent = '· reconnecting…';
    const exp = Math.min(5000, 250 * 2 ** attempts++);
    setTimeout(connect, exp / 2 + Math.random() * exp / 2);
  };
}
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const t = document.getElementById('t');
  fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ user: 'dock', text: t.value }) });
  t.value = '';
};
add('system', 'dock page loaded from ' + location.origin);
const ctl = window.obsstudio;
const info = { ua: navigator.userAgent, isSecureContext, obsstudio: !!ctl, obsPluginVersion: ctl && ctl.pluginVersion,
  obsFunctions: ctl ? Object.keys(ctl).sort() : [], size: [innerWidth, innerHeight], visibility: document.visibilityState };
report('dock.loaded', info);
// In docks, window.obsstudio may exist without its callbacks ever firing: report either outcome.
if (ctl && ctl.getControlLevel) {
  const timer = setTimeout(() => report('dock.controlLevel', { result: 'no callback within 3 s' }), 3000);
  try { ctl.getControlLevel(level => { clearTimeout(timer); report('dock.controlLevel', { result: level }); }); }
  catch (e) { clearTimeout(timer); report('dock.controlLevel', { result: 'threw: ' + e }); }
}
connect();
</script>
</body>
</html>
