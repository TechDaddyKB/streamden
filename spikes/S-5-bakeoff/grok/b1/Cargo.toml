license = "GPL-3.0-or-later"
publish = false
description = "StreamDen spike S-5 B-1: bounded Tokio action queue (Grok bake-off)"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
