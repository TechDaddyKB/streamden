[package]
name = "s3-scripting"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike S-3 (DEN-4): QuickJS in-process + Python worker pool measurements. Throwaway."
license = "GPL-3.0-or-later"

# Standalone: never attach to a parent workspace.
[workspace]

[dependencies]
libc = "0.2"
rquickjs = { version = "0.14.0", features = ["futures", "macro"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }

[profile.release]
debug = 1
