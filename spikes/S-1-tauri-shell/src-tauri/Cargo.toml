[package]
name = "s1-tauri-shell"
version = "0.0.0"
description = "StreamDen spike S-1 (DEN-2): Tauri 2 shell reliability on Hyprland + NVIDIA. Throwaway code."
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-wayland-nvidia-quirk = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["time", "sync", "net", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version wry uses; only for webkit_web_view_terminate_web_process().
webkit2gtk = { version = "2.0.2", features = ["v2_34"] }

[features]
# Always embed the built frontend (`../dist`) so a plain `cargo build` works
# without the Tauri CLI. This spike never uses the Vite dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
debug = "line-tables-only"
